spring.application.name=AILogistics-BackEnd

server.port=5555

# ===============================
# Database Configuration
# ===============================
spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/ailogistic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.password=your-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA & Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ===============================
# Gmail SMTP Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
#some live servers block 587 port
#spring.mail.port=465 
spring.mail.username=your-id
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#The maximum size allowed for a single uploaded file.
spring.servlet.multipart.max-file-size=100MB  
#The total size of the entire request (all form data + all files combined).
spring.servlet.multipart.max-request-size=100MB

# ===============================
# Custom Values
# ===============================
admin.name=ADMIN
admin.email=admin@gmail.com
admin.password=admin123