<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div style="max-width:420px;">
      <span class="hero-eyebrow">Welcome back</span>
      <h2 class="mt-3" style="color:var(--paper);">Pick up right where the manifest left off.</h2>
      <p class="text-muted-light mt-3">Log in as a customer to track a shipment, as a driver to see your queue, or as admin to manage the network.</p>
      <div class="panel mt-5">
        <img class="img-fluid" alt="" src="assets/images/delivery.gif">
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a href="/" class="navbar-brand d-inline-flex mb-4"><span class="brand-mark">AL</span>AI Logistics</a>
      <h3>Log in</h3>
      <p class="text-muted-light small mb-4">Choose your role to continue.</p>

      <ul class="nav nav-pills mb-4 gap-2" id="roleTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active btn-ghost-light" id="tab-customer" data-bs-toggle="pill" data-bs-target="#pane-customer" type="button" data-role="customer">
            <i class="bi bi-person-badge me-1"></i>Customer
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link btn-ghost-light" id="tab-driver" data-bs-toggle="pill" data-bs-target="#pane-driver" type="button" data-role="driver">
            <i class="bi bi-truck me-1"></i>Driver
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link btn-ghost-light" id="tab-admin" data-bs-toggle="pill" data-bs-target="#pane-admin" type="button" data-role="admin">
            <i class="bi bi-shield-check me-1"></i>Admin
          </button>
        </li>
      </ul>
	  <p th:if="${success}" th:text="${success}" class="alert alert-success"></p>
	  <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
	  <i class="bi bi-person-badge me-1"></i>Customer Login
      <form action="/customer/login" method="post"  id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input name="email" type="email" class="form-control" id="lEmail" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" id="lPassword" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit" class="btn btn-amber w-100 mt-3" id="loginBtn">Login</button>
      </form>
		<!-- Google Login (handled by Spring Security) -->
	    <a th:href="@{/oauth2/authorization/google}">
	         <img height="50px" alt="" src="https://programtom.com/dev/wp-content/uploads/2023/12/1_u0bwdudgoyKjSLntsRcqiw.png">
	    </a>
      <hr>
      <i class="bi bi-truck me-1"></i>Driver Login
      <form action="/driver/login" method="post"  id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input name="email" type="email" class="form-control" id="lEmail" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" id="lPassword" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit" class="btn btn-amber w-100 mt-3" id="loginBtn">Login</button>
      </form>
      <hr>
      <i class="bi bi-shield-check me-1"></i>Admin Login
      <form action="/admin/login" method="post"  id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input name="email" type="email" class="form-control" id="lEmail" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" id="lPassword" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit" class="btn btn-amber w-100 mt-3" id="loginBtn">Login</button>
      </form>

      <p class="text-muted-light small mt-4 text-center">New here? <a href="register" class="text-amber">Create an account</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
