<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="admin-dashboard" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Admin</div>
    <a href="admin-dashboard" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="drivers" class="sidebar-link"><i class="bi bi-people"></i>Drivers</a>
    <div class="sidebar-section-label">Account</div>
    <a th:href="@{/logout}"  class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="fw-semibold">Welcome: <span  th:text='${session.admin.name}'></span></div>
          <div class="small text-muted-light">All customers &amp; drivers</div>
        </div>
      </div>
    </div>

    <div class="app-content">
      <div class="row g-3" id="statCards"></div>

      <div class="row g-4 mt-1">
        <div class="col-lg">
          <div class="panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">All shipments</h5>
              <span class="chip" id="shipmentCount" >-</span>
            </div>
            <div class="table-responsive">
              <table class="table table-manifest align-middle mb-0">
                <thead><tr><th>Shipment</th><th>Route</th><th>Driver</th><th>Status</th><th>Booked</th></tr></thead>
                <tbody id="shipmentRows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
